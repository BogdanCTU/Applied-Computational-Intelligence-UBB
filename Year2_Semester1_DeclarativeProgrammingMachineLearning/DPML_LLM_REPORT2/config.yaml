project:
  name: Local_LLM_Safety_Research
  version: "1.0.0"
  python_version: "3.13"
  local_only: true
  dataset_version: "v1.0"

model:
  provider: ollama
  baseline: "qwen3.5:4b"
  mitigated: "qwen3.5:4b-safety"
  expected_architecture: "qwen3_5"
  max_parameters: 4500000000
  temperature: 0.0
  num_predict: 256
  think: false

ollama:
  host: "http://127.0.0.1:11434"
  timeout_seconds: 180
  retries: 3
  concurrency: 1
  rate_limit_delay_seconds: 0.0

penetration:
  minimum_tests_per_category: 100
  categories: 12
  random_seed: 42
  multi_turn_enabled: true
  eval_split: "held_out_eval"
  baseline_discovery_sample_per_category: 10

evaluation:
  preserve_raw_responses: true
  manual_review_enabled: true
  confidence_level: 0.95
  rule_version: "v2"

fine_tuning:
  enabled: true
  method: lora
  max_sequence_length: 384
  batch_size: 1
  num_layers: 4
  iters: 60
  learning_rate: 0.0001
  lora_rank: 8
  lora_alpha: 16.0
  lora_scale: 2.0
  lora_dropout: 0.0
  steps_per_report: 10
  steps_per_eval: 20
  save_every: 40
  val_batches: 10
  grad_checkpoint: true
  mask_prompt: true
  validation_enabled: true
  seed: 42

storage:
  sqlite_path: "5_Data/sqlite/research.db"
  preserve_experiments: true
  backup_dir: "5_Data/backups"
  export_dir: "5_Data/exports"
