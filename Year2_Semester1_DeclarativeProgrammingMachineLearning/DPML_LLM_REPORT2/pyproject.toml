[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-safety-research"
version = "1.0.0"
description = "Local LLM Adversarial Safety Testing, Fine-Tuning & Mitigation Research Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "AI Safety Research Engineering" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]

[tool.setuptools.package-dir]
source = "4_Source"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["6_Tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring local Ollama or MLX weights",
    "slow: marks slow end-to-end tests"
]

[tool.coverage.run]
source = ["4_Source"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
