version: "1.0.0"

model:
  model_id: "mlx-community/Qwen2.5-Coder-3B-Instruct-4bit"
  display_name: "Qwen2.5-Coder-3B-Instruct (4-bit MLX)"
  architecture: "qwen2"
  parameter_count_b: 3.09
  context_window: 32768
  quantization: "4-bit"

lora:
  fine_tune_type: "lora"
  rank: 8
  alpha: 16.0
  dropout: 0.05
  num_layers: 16
  learning_rate: 0.0001
  batch_size: 2
  iters: 600
  val_batches: 25
  steps_per_report: 10
  steps_per_eval: 50
  save_every: 100
  grad_accumulation_steps: 2
  grad_checkpoint: true
  max_seq_length: 2048
  seed: 42

dataset:
  sources:
    - "spider"
    - "synthetic"
  train_split_ratio: 0.85
  valid_split_ratio: 0.10
  test_split_ratio: 0.05
  seed: 42

evaluation:
  batch_size: 1
  max_tokens: 512
  temperature: 0.0
  timeout_seconds: 5.0
  strict_row_order: false
  metrics:
    - "execution_accuracy"
    - "exact_match"
    - "valid_sql_rate"
